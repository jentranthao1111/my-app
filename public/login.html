<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">
        <h2>Login</h2>
        <form class="login-form">
            <label>Username:</label>
            <input type="text" id="username" placeholder="Enter your username" required>

            <label>Password:</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="submit" id="user-login">Login</button>

            <button type="button" id="employee-login">Login as Employee</button>
        </form>

        <p>
            Don't have an account? 
            <a href="signup.html" id="signup-link">Sign Up</a>
        </p>
    </div>

    <script>
        document.getElementById("employee-login").addEventListener("click", function() {
            window.location.href = "employee-login.html"; // Redirect to Employee Login Page
        });
    </script>

</body>
</html>
