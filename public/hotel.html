<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel the World with Hotel E-Commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen h-screen p-0">

    <div class="bg-white shadow-lg rounded-lg p-6 w-full max-w-full h-full">
        <h2 class="text-2xl font-semibold text-gray-700 mb-4">Earn Toward Free Nights + More Faster</h2>
        
        <div class="relative mb-4">
            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Where can we take you?" 
                class="w-full px-10 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
                onkeyup="filterSuggestions()"
            >
            <ul id="suggestions" class="absolute bg-white w-full border rounded-lg mt-1 shadow-md hidden"></ul>
        </div>

        <div class="flex space-x-4 mb-4">
            <div class="w-1/2">
                <label class="text-gray-600 text-sm font-semibold">Check-in</label>
                <input type="date" id="checkInDate" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            </div>
            <div class="w-1/2">
                <label class="text-gray-600 text-sm font-semibold">Check-out</label>
                <input type="date" id="checkOutDate" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            </div>
        </div>

        <div>
            <button id='findbtn' class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">
                Find Hotel
            </button>
        </div>

        <hr class="my-4"/>

        <hr class="my-4"/>
        <div class="overflow-x-auto h-full">
            <table class="w-full text-left border-collapse border border-gray-300">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="border border-gray-300 px-4 py-2">Hotel Name</th>
                        <th class="border border-gray-300 px-4 py-2">Address</th>
                        <th class="border border-gray-300 px-4 py-2">Category</th>
                        <th class="border border-gray-300 px-4 py-2">Email</th>
                    </tr>
                </thead>
                <tbody id="hotelTableBody">
                    <!-- Dynamic hotel rows go here -->
                </tbody>
            </table>
        </div>

         
        <div id='hotel_result'>
            <!-- Placeholder for results -->
        </div>

       

    </div>

    <script src="hotel.js"></script>

</body>
</html>
